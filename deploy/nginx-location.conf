# Блок для сайта it.onlab.su в ISPmanager (/etc/nginx/vhosts/www-root/it.onlab.su.conf),
# заменяет стандартный «location / {...}» в блоке server на 443.
# ВНИМАНИЕ: если изменить сайт в панели ISPmanager, она может перезаписать файл — тогда вставить этот блок снова.
	location / {
		proxy_pass http://127.0.0.1:3010;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_read_timeout 120s;
		client_max_body_size 2m;
	}
	add_header Strict-Transport-Security "max-age=31536000" always;
